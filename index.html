}

.q-main{display:flex; flex-direction:column; align-items:center; justify-content:center; margin:15px 0;}

<script>

const EXPIRE_DATE = new Date(2026,7,21,23,59,59);

const SYSTEMS_DEF = [

    {name: "DNA ETA",   fn: h => h.slice(-5).filter(x => x === "P").length > h.slice(-5).filter(x => x === "B").length ? "P" : "B", type: "trend"},

 {name: "DNA IOTA",  fn: h => h.slice(-6).filter(x => x === "P").length > h.slice(-6).filter(x => x === "B").length ? "P" : "B", type: "trend"},

{

    Object.keys(patternDB).forEach(k=>delete patternDB[k]);
Object.keys(markovDB).forEach(k=>delete markovDB[k]);

    const h = history.filter(x=>x!="T");

    for(let len=PATTERN_MIN;len<=PATTERN_MAX;len++){

const state=key;

if(!markovDB[state]){

markovDB[state]={P:0,B:0};

}

markovDB[state][next]++;

}

            if(!patternDB[key]){

           const age = h.length - (i + len);

const recencyWeight =
Math.exp(-age/25);

patternDB[key][next]+=recencyWeight;

    if (history.length === 0) return;

   let wins = Array(12).fill(0);

function analyzeShoeProfile() {
    const hNoT = history.filter(x => x !== 'T');
    if (hNoT.length < 5)
    return {
        type: "ANALYZING",

    return {type: "RANDOM", desc: "ขอนสุ่ม (Random Shoe)"};

function searchPattern(){

    const h=history.filter(x=>x!="T");

    let scoreP=0;

    let scoreB=0;

    for(let len=PATTERN_MAX;len>=PATTERN_MIN;len--){

        const weight=len;

        scoreP+=(p/total)*weight;

        scoreB+=(b/total)*weight;

    }

    return{

        scoreP,

        scoreB

return{

return{

P:d.P/total,

B:d.B/total

};

sysWeights[i]

*

shoeMultiplier

momentum

regimeBonus;

       if (pred === "P") {

if (pred === "B") {

}
    });
    consensus = 0;

SYSTEMS_DEF.forEach(sys => {

});
const total = scoreP + scoreB;

if (total === 0) {

}

// ===== Bayesian Confidence =====

const alpha = 3;
const beta = 3;

const pProb =
    (scoreP + alpha) /
    (scoreP + scoreB + alpha + beta);

const bProb =
    (scoreB + alpha) /
    (scoreP + scoreB + alpha + beta);

const sample = history.filter(x => x !== "T").length;

const sampleBoost = Math.min(sample / 80, 1);

const prob = Math.round(
    Math.max(pProb, bProb) *
    100 *
    sampleBoost
);

const side = pProb > bProb ? "P" : "B";

// ===========================

let reason =
    prob > 85
        ? `🔥 ความแม่นยำสูงสุด! ตรวจพบรูปแบบที่เสถียรใน ${shoe.desc}`
        : (
            prob > 70
                ? `⚡ สัญญาณแรง มั่นใจในระดับสูงตามตรรกะ ${shoe.type}`
                : `📡 สัญญาณปกติ แนะนำเดินเงินอย่างระมัดระวัง`
        );

return {
    side,
    prob,
    reason,
    consensus
};
}

history.push(v);

buildPatternMemory();

processDNAValidation();

updateUI();

}
function undo(){

history.pop();

buildPatternMemory();

processDNAValidation();

updateUI();

}

function clearAll() {

    if(!confirm("Reset all data?")) return;

    history = [];

    Object.keys(patternDB).forEach(k => delete patternDB[k]);
    Object.keys(markovDB).forEach(k => delete markovDB[k]);

    sysWeights.fill(1.0);

    sysWinRates.fill(0);

    sysHistory = Array.from({length:12},()=>[]);

    buildPatternMemory();

    processDNAValidation();

    updateUI();

}

function updateUI() {

    const pred = calculateQuantumPrediction(),
          shoe = analyzeShoeProfile();

    const p = history.filter(x => x === "P").length;
    const b = history.filter(x => x === "B").length;
    const t = history.filter(x => x === "T").length;

    document.getElementById("pCount").innerText = p;
    document.getElementById("bCount").innerText = b;
    document.getElementById("tCount").innerText = t;
    document.getElementById("totalCount").innerText = history.length;

    document.getElementById("qPredict").innerText =
    pred.side
        ? (pred.side === "P" ? "PLAYER" : "BANKER")
        : "WAITING";
    document.getElementById("qPredict").className = pred.side ? "side-" + pred.side : "side-wait";
    document.getElementById("qConfidence").innerText = pred.prob + "%";
   document.getElementById("qConsensus").innerText =
(pred.consensus ?? 0) + " / 12";
    document.getElementById("aiReasoning").innerText = pred.reason;
    document.getElementById("shoeProfile").innerText = shoe.desc;
    renderSystems(); drawRoads();
}

function renderSystems() {

    const list = document.getElementById("systemsList");
    const hNoT = history.filter(x => x !== "T");

    list.innerHTML = SYSTEMS_DEF.map((sys, i) => {

        const pred = sys.fn(hNoT) || "-";
        const wr = Math.round(sysWinRates[i] * 100);
        const w = sysWeights[i].toFixed(2);

        const hist = sysHistory[i]
        .map(win =>
            `<span style="background:${win ? 'var(--green)' : 'var(--red)'}"></span>`
        )
        .join("");

        return `
        <div class="sys-row ${sysWeights[i] > 0.9 ? 'radar-glow' : ''}">

            <div class="sys-info">

            <div class="sys-name">

    <span class="sys-no">
        ${i+1}.
    </span>

    ${sys.name}

</div>

                <div class="sys-weight">
                    RELIABILITY : ${w}
                </div>

            </div>

            <div class="sys-pred"
                 style="color:${pred==="P"?"var(--blue)":"var(--red)"}">

                 ${pred}

            </div>

            <div class="sys-stats">

                WIN : ${wr}%

            </div>

            <div class="sys-history">

                ${hist}

            </div>

        </div>
        `;

    }).join("");

}
function drawRoads(){

    const beadC = document.getElementById("beadRoad");
    const bdCtx = beadC.getContext("2d");

    const ratio = window.devicePixelRatio || 1;

    const rect = beadC.getBoundingClientRect();
    if(rect.width === 0) return;

    beadC.width = rect.width * ratio;
    beadC.height = rect.height * ratio;

    bdCtx.setTransform(ratio,0,0,ratio,0,0);


    bdCtx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    const cell = 18;
    const font = 13;

    bdCtx.textAlign="center";
    bdCtx.textBaseline="middle";
    bdCtx.font="bold "+font+"px Arial";

/* ===== วางตรงนี้ ===== */

bdCtx.strokeStyle = "#334155";
bdCtx.lineWidth = 1;

for(let c=0;c<40;c++){

    for(let r=0;r<6;r++){

        bdCtx.strokeRect(
            c*cell,
            r*cell,
            cell,
            cell
        );

    }

}

/* ===== จบตรงนี้ ===== */

history.forEach((v,i)=>{

    const row = i % 6;
    const col = Math.floor(i/6);

    if(col >= 15) return;

    const x = col*cell + cell/2;
    const y = row*cell + cell/2;

    if(v==="P") bdCtx.fillStyle="#3b82f6";
    else if(v==="B") bdCtx.fillStyle="#ef4444";
    else bdCtx.fillStyle="#22c55e";

    bdCtx.fillText(v,x,y);

});


}
